[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracr-neoracer-demo"
version = "0.1.0"
description = "Local onboard-video and measured-pose AutoDRIVE display for TraCR"
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.9.5,<4", "Pillow>=10.3,<12"]

[project.optional-dependencies]
camera = ["opencv-contrib-python>=4.10,<5", "numpy>=1.24,<3"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
tracr-demo = "tracr_demo.server:main"

[tool.setuptools.packages.find]
include = ["tracr_demo*"]

[tool.setuptools.package-data]
tracr_demo = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
